name: Go CI Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

env:
  GO_VERSION: "1.22"

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 📦 Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # ⚙️ Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # ⚡ Cache dependencies
      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}

      # 📥 Install deps
      - name: Install Dependencies
        run: go mod tidy

      # 🔍 Lint (optional but recommended)
      - name: Run Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      # 🧪 Run tests
      - name: Run Tests
        run: go test ./... -v -cover

      # 🏗️ Build check
      - name: Build
        run: go build -v ./...

      # 📊 Upload coverage (optional)
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out